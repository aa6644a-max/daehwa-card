<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대화카드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="투명필름 대화카드를 화면 위에 올려두고 감상하는 관상용 화면">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- iPhone 은 상태바를 숨길 수 없다. black-translucent 로 두면 상태바 글자가 흰색이 되어
     순백 배경 위에서 사실상 안 보이고, 웹 내용이 상태바 아래까지 깔린다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="대화카드">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 언어 선택. QR 로 들어온 사람이 가장 먼저 보는 화면이며, 매번 여기서 시작한다.
     ?lang=ko|en|ja|zh 로 들어오면 건너뛴다(나라별 QR 을 따로 뿌릴 때). -->
<div id="langpick">
  <div id="langpick-box">
    <p id="langpick-title">Language</p>
    <button type="button" class="lang-btn" data-lang="ko" lang="ko">한국어</button>
    <button type="button" class="lang-btn" data-lang="en" lang="en">English</button>
    <button type="button" class="lang-btn" data-lang="ja" lang="ja">日本語</button>
    <button type="button" class="lang-btn" data-lang="zh" lang="zh-Hant">繁體中文</button>
  </div>
</div>

<div id="app">
  <!-- 상단 아트워크. 길게 누르면 설정 패널이 열리는 지점이기도 하다. -->
  <header id="topbar">
    <img id="top-art" alt="">
  </header>

  <!-- 카드를 올리는 흰 무대. 가운데 가이드는 CSS 로 그린다. -->
  <main id="stage" aria-hidden="true">
    <div id="card-guide"></div>
  </main>

  <!-- 하단 아트워크. 두 번 탭하면 전체화면. -->
  <footer id="bottombar">
    <img id="bottom-art" alt="">
  </footer>
</div>

<!-- 화면 전체를 균일하게 어둡게/밝게 만드는 레이어 -->
<div id="dimmer"></div>

<!-- 화면 꺼짐 방지 fallback (Wake Lock 미지원 기기용) -->
<video id="keepalive" muted playsinline loop preload="auto" disableremoteplayback aria-hidden="true" tabindex="-1">
  <source src="assets/keepalive.mp4" type="video/mp4">
  <source src="assets/keepalive.webm" type="video/webm">
</video>

<!-- 안내 배너들 (아래에서부터 쌓임) -->
<div id="notices">
  <!-- 꺼짐 방지 실패 안내 -->
  <div id="sleep-warn" hidden>
    <p id="sleep-warn-text"></p>
    <button type="button" id="sleep-warn-close">OK</button>
  </div>

  <!-- 전체화면을 쓸 수 없는 기기(아이폰)에서 배너를 두 번 탭했을 때 -->
  <div id="fs-note" hidden>
    <p id="fs-note-text"></p>
    <button type="button" id="fs-note-close">OK</button>
  </div>

  <!-- 홈 화면 추가 안내 (최초 1회) -->
  <div id="a2hs" hidden>
    <p id="a2hs-text"></p>
    <button type="button" id="a2hs-close">OK</button>
  </div>
</div>

<!-- 숨김 조절 패널: 상단 '대화카드' 문구를 1초간 길게 누르면 열림 -->
<div id="panel" hidden>
  <div id="panel-box" role="dialog" aria-label="호흡 설정">
    <h2>호흡 설정</h2>

    <label for="wave">파형</label>
    <select id="wave">
      <option value="breathe">호흡 — 균일하게 오르내림</option>
      <option value="heart">심장박동 — 쿵쿵 두 번 후 쉼</option>
    </select>

    <label for="period">주기 <output id="period-out"></output></label>
    <input type="range" id="period" min="0.5" max="12" step="0.1">

    <label for="depth">어두워지는 정도 <output id="depth-out"></output></label>
    <input type="range" id="depth" min="0" max="40" step="1">

    <div id="ease-row">
      <label for="ease">곡선</label>
      <select id="ease">
        <option value="ease-in-out">부드럽게 (ease-in-out)</option>
        <option value="linear">일정하게 (linear)</option>
        <option value="cubic-bezier(.4,0,.6,1)">깊게 (sine 유사)</option>
      </select>
    </div>

    <details id="diag">
      <summary>기기 진단 정보</summary>
      <pre id="diag-body"></pre>
      <button type="button" id="diag-fs">전체화면 지금 시도</button>
    </details>

    <button type="button" id="panel-lang">언어 다시 선택</button>

    <div id="panel-actions">
      <button type="button" id="panel-reset">기본값</button>
      <button type="button" id="panel-close">닫기</button>
    </div>

    <p id="panel-hint">값은 이 기기에 저장됩니다. 실물 카드를 올려두고 맞춰보세요.<br>
      주기 하한은 광과민성 발작 기준(초당 3회)을 넘지 않도록 파형별로 다릅니다.</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
